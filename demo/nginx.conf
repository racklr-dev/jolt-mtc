events { worker_connections 1024; }

http {
  default_type text/plain;

  server {
    listen 8443 ssl;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    # The MTC certificate travels at the application layer (X-MTC-Cert), not as
    # an mTLS client cert: stock OpenSSL/nginx cannot process a cert whose
    # signatureAlgorithm is id-alg-mtcProof during the TLS handshake. nginx
    # delegates MTC verification to the sidecar via auth_request.
    location = /auth {
      internal;
      proxy_pass http://mtc-sidecar:8080/auth;
      proxy_set_header X-Client-Cert $http_x_mtc_cert;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location = / {
      return 200 "nginx up\n";
    }

    location /protected {
      auth_request /auth;
      auth_request_set $auth_status $upstream_status;
      root /html;
      try_files /protected.txt =404;
    }
  }
}

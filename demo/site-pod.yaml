apiVersion: v1
kind: Pod
metadata:
  name: mtc-demo
  labels:
    app: mtc-demo
spec:
  containers:
  - name: mtc-ca
    image: mtc-ca:latest
    ports:
    - containerPort: 8080
      hostPort: 8080
    env:
    - name: MTC_DATA_DIR
      value: /data
    volumeMounts:
    - mountPath: /data
      name: ca-data
  - name: demo-site
    image: docker.io/library/nginx
    ports:
    - containerPort: 8443
      hostPort: 8443
    volumeMounts:
    - mountPath: /etc/nginx/nginx.conf
      name: nginx-conf
      subPath: nginx.conf
      readOnly: true
    - mountPath: /site
      name: site
      readOnly: true
  volumes:
  - name: ca-data
    hostPath:
      path: /home/jm/projects/jolt/jolt-lang/mtc/demo/data
      type: DirectoryOrCreate
  - name: nginx-conf
    hostPath:
      path: /home/jm/projects/jolt/jolt-lang/mtc/demo/nginx-site.conf
      type: File
  - name: site
    hostPath:
      path: /home/jm/projects/jolt/jolt-lang/mtc/demo/site
      type: Directory
